[project]
name = "wayfinder-ai-engine"
version = "0.2.0"
description = "Python/FastAPI travel-intelligence service for WayFinder."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "uvicorn>=0.27"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pyright>=1.1",
  "ruff>=0.5"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
