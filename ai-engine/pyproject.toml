[project]
name = "wayfinder-ai-engine"
version = "0.2.0"
description = "Python/FastAPI travel-intelligence service for WayFinder."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "uvicorn>=0.27"
]

[tool.ruff]
line-length = 120

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
